<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jogo do Estoque — CVS Cestas</title>
<style>
  body {
    font-family: 'Comic Sans MS', sans-serif;
    background: #f7f8fa;
    color: #333;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  h1 { color: #c21f2e; }
  .box {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin: 20px auto;
    max-width: 600px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  button {
    font-size: 18px;
    padding: 14px 22px;
    border: none;
    border-radius: 12px;
    background: #c21f2e;
    color: white;
    cursor: pointer;
    margin: 10px;
  }
  button:hover { background: #a31826; }
  input[type=range] {
    width: 80%;
  }
  .produto {
    margin: 25px 0;
    background: #f1f1f1;
    border-radius: 12px;
    padding: 10px;
  }
  .resultado {
    font-size: 20px;
    margin-top: 15px;
    font-weight: bold;
  }
  .verde { color: #27ae60; }
  .amarelo { color: #f39c12; }
  .vermelho { color: #e74c3c; }
</style>
</head>
<body>

<h1>Jogo do Estoque 🏭</h1>
<p>Planeje suas compras e maximize o lucro!</p>

<div class="box" id="fase1">
  <h2>1️⃣ Compre seu estoque! :)</h2>
  <div id="produtos"></div>
  <button id="btnAvancar">Confirmar Compras ✅</button>
</div>

<div class="box" id="fase2" style="display:none;">
  <h2>2️⃣ Resultado</h2>
  <div id="resultados"></div>
  <p class="resultado" id="lucroFinal"></p>
  <p class="resultado" id="lucroMaximo"></p>
  <p class="resultado" id="percentual"></p>
  <button onclick="window.location.reload()">Jogar de Novo 🔁</button>
</div>

<script>
const produtos = [
  { nome: "Produto A", custo: 10, preco: 20 },
  { nome: "Produto B", custo: 15, preco: 30 },
  { nome: "Produto C", custo: 8,  preco: 14 }
];

const produtosDiv = document.getElementById("produtos");
const resultadosDiv = document.getElementById("resultados");
const lucroFinal = document.getElementById("lucroFinal");
const lucroMaximo = document.getElementById("lucroMaximo");
const percentual = document.getElementById("percentual");
const btnAvancar = document.getElementById("btnAvancar");

let estimada = {};
let real = {};
let compras = {};

// gera demandas estimadas e reais
produtos.forEach(p => {
  const base = Math.floor(Math.random() * 80) + 40; // 40 a 120
  estimada[p.nome] = base;
  real[p.nome] = Math.round(base * (0.8 + Math.random() * 0.4)); // ±20%
});

// mostra os produtos
produtosDiv.innerHTML = produtos.map((p,i)=>`
  <div class="produto">
    <h3>${p.nome}</h3>
    <p>💰 Custo: R$${p.custo} | 💵 Preço: R$${p.preco}</p>
    <p>📦 Demanda estimada: <b>${estimada[p.nome]} unidades</b></p>
    <input type="range" min="0" max="${estimada[p.nome]*2}" value="${estimada[p.nome]}" id="range${i}">
    <p>Você vai comprar: <b><span id="val${i}">${estimada[p.nome]}</span></b> unidades</p>
  </div>
`).join('');

produtos.forEach((p,i)=>{
  const range = document.getElementById("range"+i);
  const val = document.getElementById("val"+i);
  range.addEventListener("input", ()=>{
    val.textContent = range.value;
  });
});

btnAvancar.addEventListener("click", ()=>{
  produtos.forEach((p,i)=>{
    compras[p.nome] = Number(document.getElementById("range"+i).value);
  });
  mostrarResultado();
});

function mostrarResultado(){
  document.getElementById("fase1").style.display="none";
  document.getElementById("fase2").style.display="block";

  let lucroTotal = 0;
  let lucroMax = 0;

  resultadosDiv.innerHTML = produtos.map(p=>{
    const comprado = compras[p.nome];
    const demandaReal = real[p.nome];
    const vendido = Math.min(comprado, demandaReal);
    const sobra = Math.max(0, comprado - demandaReal);
    const falta = Math.max(0, demandaReal - comprado);
    const receita = vendido * p.preco;
    const custo = comprado * p.custo;
    const lucro = receita - custo;
    lucroTotal += lucro;

    // lucro máximo = atender 100% da demanda real (sem sobras)
    const lucroIdeal = (demandaReal * (p.preco - p.custo));
    lucroMax += lucroIdeal;

    let msg = "";
    let cor = "";
    if(falta>0) { msg = `Faltaram ${falta} unidades 😢`; cor = "vermelho"; }
    else if(sobra>0) { msg = `Sobraram ${sobra} unidades 😅`; cor = "amarelo"; }
    else { msg = `Perfeito! Atendeu tudo! 🎉`; cor = "verde"; }

    return `
      <div class="produto">
        <h3>${p.nome}</h3>
        <p>🧮 Demanda real: ${demandaReal}</p>
        <p class="${cor}">${msg}</p>
        <p>💵 Lucro: <b>R$${lucro.toFixed(2)}</b></p>
      </div>
    `;
  }).join('');

  // mostrar resultados gerais
  const percentualLucro = lucroMax > 0 ? (lucroTotal / lucroMax) * 100 : 0;

  lucroFinal.textContent = `💰 Seu lucro total: R$${lucroTotal.toFixed(2)}`;
  lucroMaximo.textContent = `⭐ Lucro máximo possível: R$${lucroMax.toFixed(2)}`;
  percentual.textContent = `📊 Você atingiu ${percentualLucro.toFixed(1)}% do lucro máximo!`;

  if(lucroTotal > 0) lucroFinal.className="resultado verde";
  else lucroFinal.className="resultado vermelho";
}
</script>

</body>
</html>
